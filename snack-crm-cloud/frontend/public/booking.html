<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book an Appointment | The SNACK Program</title>
    <link rel="icon" type="image/png" href="./favicon.png">
    <link rel="stylesheet" href="./styles.css?v=20260610-public-booking">
  </head>
  <body class="public-booking-page">
    <main class="public-booking-shell" aria-labelledby="booking-title">
      <header class="public-booking-header">
        <div class="public-booking-brand">
          <span class="brand-mark" aria-hidden="true">
            <img src="./favicon.png" alt="">
          </span>
          <div>
            <p class="eyebrow">The SNACK Program</p>
            <h1 id="booking-title">Book an Appointment</h1>
          </div>
        </div>
        <a class="public-booking-link" href="https://www.snackprogram.org">snackprogram.org</a>
      </header>

      <section id="booking-confirmation" class="public-booking-confirmation" hidden aria-live="polite"></section>

      <form id="public-booking-form" class="public-booking-form">
        <section class="public-booking-card public-booking-step" aria-labelledby="booking-service-title">
          <div class="public-booking-step-heading">
            <span>1</span>
            <div>
              <h2 id="booking-service-title">Appointment</h2>
              <p>Appointments are free and held at the SNACK Program office.</p>
            </div>
          </div>

          <label class="public-field public-field-wide">
            <span>Appointment type</span>
            <select id="public-service-id" name="serviceId" required></select>
          </label>

          <label class="public-field">
            <span>Preferred language</span>
            <select id="public-preferred-language" name="preferredLanguage" required>
              <option value="English">English</option>
              <option value="Spanish">Spanish</option>
            </select>
          </label>

          <label class="public-field">
            <span>Preferred contact</span>
            <select name="preferredContactMethod">
              <option value="Call">Call</option>
              <option value="Text">Text</option>
              <option value="Email">Email</option>
            </select>
          </label>
        </section>

        <section class="public-booking-card public-booking-step" aria-labelledby="booking-time-title">
          <div class="public-booking-step-heading">
            <span>2</span>
            <div>
              <h2 id="booking-time-title">Time</h2>
              <p>Choose one available appointment time.</p>
            </div>
          </div>

          <div id="public-availability" class="public-availability" aria-live="polite">
            <p class="public-empty">Loading available times...</p>
          </div>
        </section>

        <section class="public-booking-card public-booking-step" aria-labelledby="booking-family-title">
          <div class="public-booking-step-heading">
            <span>3</span>
            <div>
              <h2 id="booking-family-title">Family</h2>
              <p>Use the child’s name for the appointment.</p>
            </div>
          </div>

          <div class="public-booking-grid">
            <label class="public-field">
              <span>Child first name</span>
              <input name="firstName" autocomplete="given-name" required>
            </label>

            <label class="public-field">
              <span>Child last name</span>
              <input name="lastName" autocomplete="family-name" required>
            </label>

            <label class="public-field">
              <span>Caregiver name</span>
              <input name="parentName" autocomplete="name" required>
            </label>

            <label class="public-field">
              <span>Phone</span>
              <input name="phone" type="tel" autocomplete="tel" required>
            </label>

            <label class="public-field public-field-wide">
              <span>Email</span>
              <input name="email" type="email" autocomplete="email">
            </label>

            <label class="public-field public-field-wide">
              <span>Notes</span>
              <textarea name="notes" rows="3"></textarea>
            </label>

            <label class="public-field public-honeypot" aria-hidden="true">
              <span>Website</span>
              <input name="website" tabindex="-1" autocomplete="off">
            </label>
          </div>
        </section>

        <div class="public-booking-actions">
          <p id="public-booking-status" class="status" aria-live="polite"></p>
          <button id="public-booking-submit" type="submit">Book Appointment</button>
        </div>
      </form>
    </main>

    <script src="./app-config.js"></script>
    <script type="module" src="./booking.js?v=20260610-public-booking"></script>
  </body>
</html>
