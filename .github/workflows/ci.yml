name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snack-crm-cloud/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: snack-crm-cloud/backend/package-lock.json
      - run: npm ci
      - run: npm test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snack-crm-cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: snack-crm-cloud/package-lock.json
      - run: npm ci
      - run: npm run lint
